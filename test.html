<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="Four-Wheel Alignment Cpk">四轮定位Cpk</title>
  <link rel="stylesheet" href="/css/styles_button.css">
  <link rel="stylesheet" href="/css/styles3_animation.css">
  <link rel="stylesheet" href="/css/styles4_eyeCare.js.css">
  <link rel="stylesheet" href="/css/styles5_brightness.css">
  <link rel="stylesheet" href="/css/styles6_glow.css">
  <script src="/js/script3_darkMode.js"></script>
  <script src="/js/script4_goBackOrHome.js"></script>
  <script src="/js/script5_setAnimations.js"></script>
  <script src="/js/script6_setFontSize.js"></script>
  <script src="/js/script7_setOpacityandBlur.js"></script>
  <script src="/js/script8_setEyeCare.js"></script>
  <script src="/js/script9_setbrightness.js"></script>
  <script src="/js/script10_setGlow.js"></script>
  <script src="/js/script11_setHighlight.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.js"></script>
  <link href="/css/message.min.css" rel="stylesheet" />
  <script src="/js/message.min.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="/js/script14_setLanguage.js"></script>
  <title data-en="Four-Wheel Alignment Cpk">四轮定位cpk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js">
  </script>
  <style>
    /* ===== CSS变量 - 浅色模式（默认） ===== */
    :root {
      --bg-body: #f0f4f8;
      --bg-container: #ffffff;
      --bg-toolbar: #f8fafc;
      --bg-hover: #fafbfc;
      --bg-tab: #f0f4f8;
      --bg-tab-hover: #e3e8ef;
      --bg-tab-active: #e8edff;
      --bg-summary: #f8fafc;
      --bg-config: #f8fafc;
      --bg-code: #f0f4f8;
      --bg-input: #fafbfc;

      --text-primary: #1a2332;
      --text-secondary: #4a5a6e;
      --text-muted: #6b7a8f;
      --text-light: #9e9e9e;
      --text-white: #ffffff;

      --border-color: #e9edf2;
      --border-light: #f0f4f8;
      --border-input: #dce2ea;

      --shadow-color: rgba(0, 0, 0, 0.06);

      --cpk-excellent: #2e7d32;
      --cpk-good: #e65100;
      --cpk-poor: #c62828;
      --cpk-na: #bdbdbd;

      --badge-bg: #e8f5e9;
      --badge-color: #2e7d32;

      --btn-primary-bg: #4f7df3;
      --btn-primary-hover: #3a66d9;
      --btn-success-bg: #34a853;
      --btn-success-hover: #2d9248;

      --status-dot-excellent: #2e7d32;
      --status-dot-good: #e65100;
      --status-dot-poor: #c62828;
      --status-dot-na: #bdbdbd;

      --table-header-bg: #f8fafc;
      --table-border: #e9edf2;

      --spinner-color: #4f7df3;

      --transition-speed: 0.3s;
    }

    /* ===== 深色模式（通过 .dark-mode 类适配） ===== */
    .dark-mode {
      --bg-body: #121212;
      --bg-container: #1e1e1e;
      --bg-toolbar: #2a2a2a;
      --bg-hover: #2a2a2a;
      --bg-tab: #2a2a2a;
      --bg-tab-hover: #333333;
      --bg-tab-active: #1a2a4a;
      --bg-summary: #2a2a2a;
      --bg-config: #2a2a2a;
      --bg-code: #1a1a1a;
      --bg-input: #1a1a1a;

      --text-primary: #e8edf5;
      --text-secondary: #b0b8c8;
      --text-muted: #8a9aaa;
      --text-light: #6a7a8a;
      --text-white: #ffffff;

      --border-color: #333333;
      --border-light: #2a2a2a;
      --border-input: #444444;

      --shadow-color: rgba(0, 0, 0, 0.3);

      --cpk-excellent: #66bb6a;
      --cpk-good: #ffa726;
      --cpk-poor: #ef5350;
      --cpk-na: #666666;

      --badge-bg: #1a3a1a;
      --badge-color: #66bb6a;

      --btn-primary-bg: #4f7df3;
      --btn-primary-hover: #6a8ff5;
      --btn-success-bg: #34a853;
      --btn-success-hover: #4cbf6a;

      --status-dot-excellent: #66bb6a;
      --status-dot-good: #ffa726;
      --status-dot-poor: #ef5350;
      --status-dot-na: #666666;

      --table-header-bg: #2a2a2a;
      --table-border: #333333;

      --spinner-color: #6a8ff5;
    }

    /* ===== 全局样式 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease,
        box-shadow var(--transition-speed) ease;
    }

    body {
      font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-body);
      padding: 20px;
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* ===== 进入动画 ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      background: var(--bg-container);
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 2px 12px var(--shadow-color);
      animation: fadeInUp 0.6s ease forwards;
      border: 1px solid var(--border-color);
      transition: background-color var(--transition-speed) ease,
        border-color var(--transition-speed) ease,
        box-shadow var(--transition-speed) ease;
    }

    /* ===== 操作动画（行进入） ===== */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .table-wrapper tbody tr {
      animation: slideIn 0.3s ease forwards;
      opacity: 0;
    }

    .table-wrapper tbody tr:nth-child(1) {
      animation-delay: 0.02s;
    }

    .table-wrapper tbody tr:nth-child(2) {
      animation-delay: 0.04s;
    }

    .table-wrapper tbody tr:nth-child(3) {
      animation-delay: 0.06s;
    }

    .table-wrapper tbody tr:nth-child(4) {
      animation-delay: 0.08s;
    }

    .table-wrapper tbody tr:nth-child(5) {
      animation-delay: 0.10s;
    }

    .table-wrapper tbody tr:nth-child(6) {
      animation-delay: 0.12s;
    }

    .table-wrapper tbody tr:nth-child(7) {
      animation-delay: 0.14s;
    }

    .table-wrapper tbody tr:nth-child(8) {
      animation-delay: 0.16s;
    }

    .table-wrapper tbody tr:nth-child(9) {
      animation-delay: 0.18s;
    }

    .table-wrapper tbody tr:nth-child(10) {
      animation-delay: 0.20s;
    }

    .table-wrapper tbody tr:nth-child(11) {
      animation-delay: 0.22s;
    }

    .table-wrapper tbody tr:nth-child(12) {
      animation-delay: 0.24s;
    }

    .table-wrapper tbody tr:nth-child(13) {
      animation-delay: 0.26s;
    }

    .table-wrapper tbody tr:nth-child(14) {
      animation-delay: 0.28s;
    }

    .table-wrapper tbody tr:nth-child(15) {
      animation-delay: 0.30s;
    }

    .table-wrapper tbody tr:nth-child(16) {
      animation-delay: 0.32s;
    }

    .table-wrapper tbody tr:nth-child(17) {
      animation-delay: 0.34s;
    }

    .table-wrapper tbody tr:nth-child(18) {
      animation-delay: 0.36s;
    }

    .table-wrapper tbody tr:nth-child(19) {
      animation-delay: 0.38s;
    }

    .table-wrapper tbody tr:nth-child(20) {
      animation-delay: 0.40s;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      transition: color var(--transition-speed) ease;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
      transition: color var(--transition-speed) ease;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-color);
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
      transition: color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    /* ===== 配置区域 ===== */
    .config-section {
      background: var(--bg-config);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      font-size: 12px;
      transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    .config-section summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-primary);
      transition: color var(--transition-speed) ease;
    }

    .config-section pre {
      background: var(--bg-code);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 11px;
      margin-top: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-secondary);
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .config-edit-area textarea {
      font-family: 'Consolas', monospace;
      font-size: 12px;
      padding: 8px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      resize: vertical;
      min-height: 120px;
      background: var(--bg-input);
      color: var(--text-primary);
      width: 100%;
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease;
    }

    .config-edit-area textarea:focus {
      outline: none;
      border-color: var(--btn-primary-bg);
    }

    .config-edit-area .btn-sm {
      padding: 4px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: var(--btn-primary-bg);
      color: var(--text-white);
      width: fit-content;
      transition: background-color var(--transition-speed) ease;
    }

    .config-edit-area .btn-sm:hover {
      background: var(--btn-primary-hover);
    }

    /* ===== 工具栏 ===== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 16px;
      align-items: center;
      background: var(--bg-toolbar);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    .toolbar label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color var(--transition-speed) ease;
    }

    .toolbar select {
      padding: 5px 10px;
      border: 1.5px solid var(--border-input);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-container);
      color: var(--text-primary);
      outline: none;
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease;
    }

    .toolbar select:focus {
      border-color: var(--btn-primary-bg);
    }

    /* ===== 按钮 ===== */
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-speed) ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
      color: var(--text-white);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
    }

    .btn-primary:hover {
      background: var(--btn-primary-hover);
      box-shadow: 0 2px 8px rgba(79, 125, 243, 0.3);
    }

    .btn-success {
      background: var(--btn-success-bg);
    }

    .btn-success:hover {
      background: var(--btn-success-hover);
      box-shadow: 0 2px 8px rgba(52, 168, 83, 0.3);
    }

    /* ===== 统计摘要 ===== */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: var(--bg-summary);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      text-align: center;
      transition: background-color var(--transition-speed) ease,
        border-color var(--transition-speed) ease;
    }

    .summary-card .label {
      font-size: 11px;
      color: var(--text-muted);
      transition: color var(--transition-speed) ease;
    }

    .summary-card .value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-primary);
      transition: color var(--transition-speed) ease;
    }

    /* ===== 表格 ===== */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-height: 580px;
      overflow-y: auto;
      transition: border-color var(--transition-speed) ease;
    }

    .table-wrapper::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .table-wrapper::-webkit-scrollbar-track {
      background: var(--bg-body);
      border-radius: 4px;
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: var(--border-input);
      border-radius: 4px;
    }

    .table-wrapper::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 700px;
    }

    thead {
      background: var(--table-header-bg);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background-color var(--transition-speed) ease;
    }

    th {
      padding: 10px 12px;
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--table-border);
      white-space: nowrap;
      font-size: 12px;
      background: var(--table-header-bg);
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      text-align: center;
      color: var(--text-primary);
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease;
    }

    tr:hover td {
      background: var(--bg-hover);
    }

    .col-model {
      font-weight: 600;
      color: var(--text-primary);
    }

    .cpk-value {
      font-weight: 600;
      font-family: 'Consolas', monospace;
      font-size: 13px;
    }

    .cpk-excellent {
      color: var(--cpk-excellent);
    }

    .cpk-good {
      color: var(--cpk-good);
    }

    .cpk-poor {
      color: var(--cpk-poor);
    }

    .cpk-na {
      color: var(--cpk-na);
    }

    /* ===== 状态点 ===== */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      transition: background-color var(--transition-speed) ease;
    }

    .status-dot.excellent {
      background: var(--status-dot-excellent);
    }

    .status-dot.good {
      background: var(--status-dot-good);
    }

    .status-dot.poor {
      background: var(--status-dot-poor);
    }

    .status-dot.na {
      background: var(--status-dot-na);
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      transition: color var(--transition-speed) ease;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* ===== Loading ===== */
    .loading {
      display: none;
      text-align: center;
      padding: 30px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border-color);
      border-top-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transition: border-color var(--transition-speed) ease;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      transition: border-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    .footer .hint {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer .hint span {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    /* ===== 维度Tab ===== */
    .dimension-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }

    .dimension-tabs .tab {
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--bg-tab);
      color: var(--text-secondary);
      transition: background-color var(--transition-speed) ease,
        color var(--transition-speed) ease,
        border-color var(--transition-speed) ease,
        transform 0.2s ease;
    }

    .dimension-tabs .tab:hover {
      background: var(--bg-tab-hover);
      transform: translateY(-1px);
    }

    .dimension-tabs .tab:active {
      transform: scale(0.96);
    }

    .dimension-tabs .tab.active {
      border-color: var(--btn-primary-bg);
      background: var(--bg-tab-active);
      color: var(--text-primary);
    }

    .dimension-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-right: 8px;
      transition: color var(--transition-speed) ease;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 14px;
      }

      h1 {
        font-size: 18px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1 data-en="Four-Wheel Alignment Cpk Calculator">四轮定位 Cpk 计算</h1>
      <div class="header-right">
        <span class="badge" data-en="P Qualified Data Only">仅 P 合格数据</span>
        <span id="dataStatus" style="color:var(--text-muted);" data-en="Not loaded">未加载</span>
      </div>
    </div>
    <div class="subtitle"
      data-en="Group by model, time, inspection line · Each model uses its own specification limits">
      按车型、时间、检测线号分组 · 每个车型使用各自规格上下限
    </div>

    <!-- 配置 -->
    <details class="config-section">
      <summary data-en="Current Configuration (click to expand/collapse)">当前配置（点击展开/收起）</summary>
      <div style="margin-top:8px;font-size:12px;">
        <div><strong data-en="VIN Mapping (position 11-12 → model):">VIN映射表（第11-12位 → 车型）：</strong></div>
        <div id="vinMapDisplay"
          style="background:var(--bg-code);padding:6px 10px;border-radius:4px;margin:4px 0 8px 0;font-family:Consolas,monospace;font-size:12px;color:var(--text-secondary);">
        </div>
        <div><strong data-en="Specification Table (model → parameter: [LSL, USL]):">规格表（车型 → 项目: [下限, 上限]）：</strong>
        </div>
        <div id="specsDisplay"
          style="background:var(--bg-code);padding:6px 10px;border-radius:4px;margin:4px 0 8px 0;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;color:var(--text-secondary);">
        </div>
        <div style="margin-top:6px;font-size:12px;color:var(--text-muted);"
          data-en="Tip: Modify the JSON below and click 'Apply Config' to take effect immediately, no need to reload data.">
          提示：修改下方JSON后点击「应用配置」即可生效，无需重新加载数据。
        </div>
        <div class="config-edit-area">
          <label style="font-weight:600;font-size:12px;color:var(--text-secondary);"
            data-en="Edit Configuration (JSON format):">编辑配置 (JSON格式):</label>
          <textarea id="configEditor"></textarea>
          <button class="btn-sm" id="applyConfigBtn" data-en="Apply Config">应用配置</button>
        </div>
      </div>
    </details>

    <!-- 维度切换 -->
    <div class="dimension-tabs">
      <span class="dimension-label" data-en="Time Dimension:">时间维度：</span>
      <span class="tab active" data-dim="日" data-en="Day">日</span>
      <span class="tab" data-dim="周" data-en="Week">周</span>
      <span class="tab" data-dim="月" data-en="Month">月</span>
      <span class="tab" data-dim="年" data-en="Year">年</span>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <label data-en="Model">车型 <select id="modelSelect">
          <option value="all" data-en="All">全部</option>
        </select></label>
      <label data-en="Inspection Line">检测线号 <select id="lineFilter">
          <option value="all" data-en="All">全部</option>
        </select></label>
      <button class="btn btn-primary" id="loadBtn" data-en="Load Excel">加载 Excel</button>
      <button class="btn btn-success" id="exportBtn" data-en="Export All Data">导出全部数据</button>
    </div>

    <!-- 统计摘要 -->
    <div class="summary">
      <div class="summary-card">
        <div class="label" data-en="Total Records">总记录</div>
        <div class="value" id="totalRecords">-</div>
      </div>
      <div class="summary-card">
        <div class="label" data-en="Models">车型数</div>
        <div class="value" id="totalModels">-</div>
      </div>
      <div class="summary-card">
        <div class="label" data-en="≥1.33">≥1.33</div>
        <div class="value" id="cpkExcellent" style="color:var(--cpk-excellent);">-</div>
      </div>
      <div class="summary-card">
        <div class="label" data-en="1.0~1.33">1.0~1.33</div>
        <div class="value" id="cpkGood" style="color:var(--cpk-good);">-</div>
      </div>
      <div class="summary-card">
        <div class="label" data-en="&lt;1.0">&lt;1.0</div>
        <div class="value" id="cpkPoor" style="color:var(--cpk-poor);">-</div>
      </div>
    </div>

    <div class="loading" id="loadingIndicator">
      <div class="spinner"></div>
      <p style="margin-top:8px;color:var(--text-muted);" data-en="Calculating...">计算中...</p>
    </div>

    <!-- 表格 -->
    <div class="table-wrapper" id="tableWrapper">
      <div class="empty-state">
        <div class="icon">📂</div>
        <p style="font-size:16px;font-weight:500;" data-en="Please load data">请加载数据</p>
        <p style="font-size:13px;color:var(--text-light);"
          data-en="Click 'Load Excel' to select the vehicle inspection record file">
          点击「加载 Excel」选择车辆检测记录文件
        </p>
      </div>
    </div>

    <div class="footer">
      <div class="hint">
        <span><span class="status-dot excellent"></span><span data-en="≥1.33 Adequate">≥1.33 充足</span></span>
        <span><span class="status-dot good"></span><span data-en="1.0~1.33 Critical">1.0~1.33 临界</span></span>
        <span><span class="status-dot poor"></span><span data-en="&lt;1.0 Insufficient">&lt;1.0 不足</span></span>
        <span style="color:var(--cpk-na);"><span data-en="Insufficient Data">数据不足</span></span>
      </div>
      <div id="rowCount" style="font-size:12px;color:var(--text-muted);" data-en="Showing 0 rows">显示 0 行</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
  </script>
  <script>
    // ==================== 国际化工具 ====================
    function getLocalizedText(zh, en) {
      // 检测当前语言（默认中文）
      // 可以通过外部设置 window.__lang = 'en' 来切换
      const lang = window.__lang || 'zh';
      return lang === 'en' ? en : zh;
    }

    // ==================== 可配置区域 ====================
    let VIN_MODEL_MAP = {
      'C0': 'N111',
      'C1': 'N111P',
      'C5': 'CF510V',
      'C6': 'CN115',
      'C7': 'CN112',
      'C8': 'CN110V',
      'C9': 'CN110V',
    };

    let SPECS = {
      'CF510V': {
        '左前前束': [-0.05, 0.05],
        '右前前束': [-0.05, 0.05],
        '左前外倾': [-0.25, 1.25],
        '右前外倾': [-0.25, 1.25],
        '方向盘角度': [-0.3, 0.3],
      },
      'CN110V': {
        '左前前束': [-0.05, 0.05],
        '右前前束': [-0.05, 0.05],
        '左前外倾': [-0.25, 1.25],
        '右前外倾': [-0.25, 1.25],
        '方向盘角度': [-0.3, 0.3],
      },
      'CN112': {
        '左前前束': [-0.05, 0.05],
        '右前前束': [-0.05, 0.05],
        '左前外倾': [-0.25, 1.25],
        '右前外倾': [-0.25, 1.25],
        '方向盘角度': [-0.3, 0.3],
      },
      'CN115': {
        '左前前束': [-0.05, 0.05],
        '右前前束': [-0.05, 0.05],
        '左前外倾': [-0.25, 1.25],
        '右前外倾': [-0.25, 1.25],
        '方向盘角度': [-0.3, 0.3],
      },
      'N111': {
        '左前前束': [0.133, 0.3],
        '右前前束': [0.133, 0.3],
        '左前外倾': [0.08, 1.58],
        '右前外倾': [0.08, 1.58],
        '方向盘角度': [-0.3, 0.3],
      },
      'N111P': {
        '左前前束': [0.133, 0.3],
        '右前前束': [0.133, 0.3],
        '左前外倾': [0.08, 1.58],
        '右前外倾': [0.08, 1.58],
        '方向盘角度': [-0.3, 0.3],
      },
    };

    const COLS = ['左前前束', '右前前束', '左前外倾', '右前外倾', '方向盘角度'];
    const COL_LABELS = {
      '左前前束': '左前前束CPK',
      '右前前束': '右前前束CPK',
      '左前外倾': '左前外倾CPK',
      '右前外倾': '右前外倾CPK',
      '方向盘角度': '方向盘角度CPK',
    };

    // ==================== 全局状态 ====================
    let allData = [];
    let currentRows = [];
    let currentDim = '日';

    // ==================== 工具函数 ====================
    function getWeekOfMonth(date) {
      const d = new Date(date);
      const firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
      const dayOfMonth = d.getDate();
      const firstDayOfWeek = firstDay.getDay();
      const adjusted = (firstDayOfWeek === 0) ? 6 : firstDayOfWeek - 1;
      const weekNum = Math.ceil((dayOfMonth + adjusted) / 7);
      return weekNum;
    }

    function extractModel(v) {
      if (!v || typeof v !== 'string') return '未知';
      v = v.trim().toUpperCase();
      if (v.length < 12) return '未知';
      return VIN_MODEL_MAP[v.substring(10, 12)] || '未知';
    }

    function calcCpk(vals, lo, hi) {
      const d = vals.filter(v => typeof v === 'number' && !isNaN(v) && isFinite(v));
      if (d.length < 3) return null;
      const m = d.reduce((a, b) => a + b, 0) / d.length;
      const s = Math.sqrt(d.reduce((a, b) => a + (b - m) ** 2, 0) / (d.length - 1));
      if (s === 0) return null;
      return Math.min((hi - m) / (3 * s), (m - lo) / (3 * s));
    }

    function getStatus(c) {
      if (c === null || c === undefined || isNaN(c)) return 'na';
      if (c >= 1.33) return 'excellent';
      if (c >= 1.0) return 'good';
      return 'poor';
    }

    function getCls(c) {
      const s = getStatus(c);
      if (s === 'excellent') return 'cpk-excellent';
      if (s === 'good') return 'cpk-good';
      if (s === 'poor') return 'cpk-poor';
      return 'cpk-na';
    }

    function readExcelFile(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = function (e) {
          try {
            const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            resolve(XLSX.utils.sheet_to_json(ws, { defval: '' }));
          } catch (err) { reject(err); }
        };
        r.onerror = reject;
        r.readAsArrayBuffer(file);
      });
    }

    function loadFromFile(file) {
      document.getElementById('loadingIndicator').classList.add('active');
      readExcelFile(file).then(raw => {
        document.getElementById('loadingIndicator').classList.remove('active');
        processData(raw);
        // SweetAlert2 成功提示
        const msg = getLocalizedText(
          '数据加载成功！共 ' + allData.length + ' 条合格记录',
          'Data loaded successfully! ' + allData.length + ' qualified records'
        );
        Swal.fire({
          icon: 'success',
          title: getLocalizedText('成功', 'Success'),
          text: msg,
          timer: 2000,
          showConfirmButton: false
        });
      }).catch(err => {
        document.getElementById('loadingIndicator').classList.remove('active');
        Swal.fire({
          icon: 'error',
          title: getLocalizedText('读取失败', 'Load Failed'),
          text: err.message
        });
      });
    }

    function processData(raw) {
      const cm = {};
      const h = Object.keys(raw[0] || {});
      h.forEach(k => {
        const s = String(k).trim();
        if (s.includes('VIN') || s.includes('车辆识别码')) cm['VIN'] = k;
        else if (s.includes('检测结果')) cm['检测结果'] = k;
        else if (s.includes('检测线号')) cm['检测线号'] = k;
        else if (s.includes('检测结束时间')) cm['检测结束时间'] = k;
        else if (s.includes('左前前束')) cm['左前前束'] = k;
        else if (s.includes('右前前束')) cm['右前前束'] = k;
        else if (s.includes('左前外倾')) cm['左前外倾'] = k;
        else if (s.includes('右前外倾')) cm['右前外倾'] = k;
        else if (s.includes('方向盘角度')) cm['方向盘角度'] = k;
      });

      const processed = raw.map(row => {
        const item = {
          VIN: String(row[cm['VIN']] || ''), 检测结果: String(row[cm['检测结果']] || ''),
          检测线号: String(row[cm['检测线号']] || '')
        };
        COLS.forEach(c => {
          const v = parseFloat(row[cm[c]]);
          item[c] = isNaN(v) ? null : v;
        });
        item.车型 = extractModel(item.VIN);
        let dt = row[cm['检测结束时间']];
        if (typeof dt === 'string') {
          const d = new Date(dt);
          item.日期 = isNaN(d) ? null : d;
        } else if (dt instanceof Date) { item.日期 = dt; } else {
          item
            .日期 = null;
        }
        if (item.日期 && !isNaN(item.日期)) {
          const d = new Date(item.日期);
          item.年 = d.getFullYear();
          item.月数字 = d.getMonth() + 1;
          item.月 = String(item.月数字).padStart(2, '0');
          item.日 = String(d.getDate()).padStart(2, '0');
          item.年月日 = item.年 + '-' + item.月 + '-' + item.日;
          const weekNum = getWeekOfMonth(d);
          item.周 = item.月数字 + '月第' + weekNum + '周';
          item.周排序 = item.年 * 100 + item.月数字 * 10 + weekNum;
          item.月显示 = item.年 + '-' + item.月;
          item.年显示 = String(item.年);
          const s = new Date(d.getFullYear(), 0, 1);
          const diff = (d - s + (s.getTimezoneOffset() - d.getTimezoneOffset()) * 60000) / 86400000;
          const w = Math.ceil((diff + s.getDay() + 1) / 7);
          item.年周原始 = item.年 + '-W' + String(w).padStart(2, '0');
        } else {
          item.年 = null;
          item.月 = null;
          item.月数字 = null;
          item.日 = null;
          item.年月日 = null;
          item.周 = null;
          item.周排序 = null;
          item.月显示 = null;
          item.年显示 = null;
          item.年周原始 = null;
        }
        return item;
      });

      allData = processed.filter(r => r.检测结果 === 'P');
      updateDropdowns();
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-dim="日"]')?.classList.add('active');
      currentDim = '日';
      computeAndRender('日');
      document.getElementById('dataStatus').textContent = getLocalizedText(
        '已加载 ' + allData.length + ' 条',
        'Loaded ' + allData.length + ' records'
      );

      displayConfig();
    }

    function displayConfig() {
      let vinHtml = '';
      for (const [key, val] of Object.entries(VIN_MODEL_MAP)) {
        vinHtml += key + ' → ' + val + '  ';
      }
      document.getElementById('vinMapDisplay').textContent = vinHtml || getLocalizedText('（请配置VIN映射）',
        '(Please configure VIN mapping)');

      let specHtml = '';
      for (const [model, specs] of Object.entries(SPECS)) {
        specHtml += model + ':\n';
        for (const [col, [lo, hi]] of Object.entries(specs)) {
          specHtml += '  ' + col + ': [' + lo + ', ' + hi + ']\n';
        }
      }
      document.getElementById('specsDisplay').textContent = specHtml || getLocalizedText('（请配置规格）',
        '(Please configure specifications)');

      const configObj = {
        VIN_MODEL_MAP: VIN_MODEL_MAP,
        SPECS: SPECS
      };
      document.getElementById('configEditor').value = JSON.stringify(configObj, null, 2);
    }

    function updateDropdowns() {
      const models = [...new Set(allData.map(r => r.车型).filter(m => m !== '未知' && SPECS[m]))];
      const sel = document.getElementById('modelSelect');
      const cur = sel.value;
      sel.innerHTML = '<option value="all">' + getLocalizedText('全部', 'All') + '</option>';
      models.forEach(m => sel.innerHTML += `<option value="${m}">${m}</option>`);
      if (cur && models.includes(cur)) sel.value = cur;

      const lines = [...new Set(allData.map(r => r.检测线号).filter(l => l && l !== ''))];
      const sl = document.getElementById('lineFilter');
      const cl = sl.value;
      sl.innerHTML = '<option value="all">' + getLocalizedText('全部', 'All') + '</option>';
      lines.forEach(l => sl.innerHTML += `<option value="${l}">${l}</option>`);
      if (cl && lines.includes(cl)) sl.value = cl;
    }

    function computeDimensionData(dim, modelFilter, lineFilter) {
      let data = allData;
      if (modelFilter !== 'all') data = data.filter(r => r.车型 === modelFilter);
      if (lineFilter !== 'all') data = data.filter(r => r.检测线号 === lineFilter);

      const models = [...new Set(data.map(r => r.车型).filter(m => m !== '未知' && SPECS[m]))];
      models.sort();

      let groupKey, sortKey;
      if (dim === '日') {
        groupKey = '年月日';
        sortKey = '年月日';
      } else if (dim === '周') {
        groupKey = '周';
        sortKey = '周排序';
      } else if (dim === '月') {
        groupKey = '月显示';
        sortKey = '月显示';
      } else {
        groupKey = '年显示';
        sortKey = '年显示';
      }

      const timeVals = new Set();
      data.forEach(r => {
        if (r[groupKey] !== null && r[groupKey] !== undefined && r[groupKey] !== '') timeVals.add(r[
          groupKey]);
      });
      let times = [...timeVals];
      times.sort((a, b) => {
        if (dim === '周') {
          const aData = data.find(r => r[groupKey] === a);
          const bData = data.find(r => r[groupKey] === b);
          const aSort = aData ? aData[sortKey] : 0;
          const bSort = bData ? bData[sortKey] : 0;
          return (aSort || 0) - (bSort || 0);
        }
        return String(a).localeCompare(String(b));
      });

      const rows = [];
      models.forEach(model => {
        const modelData = data.filter(r => r.车型 === model);
        times.forEach(t => {
          const groupData = modelData.filter(r => r[groupKey] === t);
          if (groupData.length < 3) return;
          const row = { '时间': String(t), '车型': model, '检测线号': groupData[0].检测线号 || '-' };
          COLS.forEach(c => {
            const spec = SPECS[model] ? SPECS[model][c] : null;
            if (spec) {
              const vals = groupData.map(r => r[c]).filter(v => v !== null && !isNaN(v));
              const cpk = calcCpk(vals, spec[0], spec[1]);
              row[COL_LABELS[c]] = (cpk !== null && !isNaN(cpk)) ? cpk : null;
            } else {
              row[COL_LABELS[c]] = null;
            }
          });
          rows.push(row);
        });
      });

      rows.sort((a, b) => {
        if (a['车型'] !== b['车型']) return a['车型'].localeCompare(b['车型']);
        if (dim === '周') {
          const aSort = data.find(r => r['周'] === a['时间'])?.周排序 || 0;
          const bSort = data.find(r => r['周'] === b['时间'])?.周排序 || 0;
          return aSort - bSort;
        }
        return String(a['时间']).localeCompare(String(b['时间']));
      });

      return rows;
    }

    function computeAndRender(dim) {
      currentDim = dim || '日';
      const modelFilter = document.getElementById('modelSelect').value;
      const lineFilter = document.getElementById('lineFilter').value;
      currentRows = computeDimensionData(currentDim, modelFilter, lineFilter);
      renderTable(currentRows);
      updateSummary(currentRows);
      const countText = getLocalizedText('显示 ' + currentRows.length + ' 行', 'Showing ' + currentRows.length +
        ' rows');
      document.getElementById('rowCount').textContent = countText;
    }

    function renderTable(rows) {
      const wrapper = document.getElementById('tableWrapper');
      if (rows.length === 0) {
        wrapper.innerHTML =
          `<div class="empty-state"><div class="icon">📭</div><p style="font-size:16px;font-weight:500;" data-en="No data">没有数据</p><p style="font-size:13px;color:var(--text-light);" data-en="Each group needs at least 3 records to calculate Cpk">每组至少需要3条记录才能计算Cpk</p></div>`;
        return;
      }

      let html = `<table>
                <thead><tr>
                        <th data-en="Model">车型</th>
                        <th data-en="Time">时间</th>
                        <th data-en="Inspection Line">检测线号</th>
                        <th data-en="Left Front Toe CPK">左前前束CPK</th>
                        <th data-en="Right Front Toe CPK">右前前束CPK</th>
                        <th data-en="Left Front Camber CPK">左前外倾CPK</th>
                        <th data-en="Right Front Camber CPK">右前外倾CPK</th>
                        <th data-en="Steering Angle CPK">方向盘角度CPK</th>
                    </tr></thead><tbody>`;

      rows.forEach(row => {
        html += `<tr>
                        <td class="col-model">${row['车型']}</td>
                        <td>${row['时间']}</td>
                        <td>${row['检测线号']}</td>`;
        COLS.forEach(c => {
          const v = row[COL_LABELS[c]];
          if (v !== null && v !== undefined && !isNaN(v) && isFinite(v)) {
            html += `<td class="cpk-value ${getCls(v)}">${v.toFixed(4)}</td>`;
          } else {
            html += `<td class="cpk-na">—</td>`;
          }
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      wrapper.innerHTML = html;
    }

    function updateSummary(rows) {
      const totalText = getLocalizedText('总记录', 'Total Records');
      document.getElementById('totalRecords').textContent = allData.length;
      const models = [...new Set(allData.map(r => r.车型).filter(m => m !== '未知' && SPECS[m]))];
      document.getElementById('totalModels').textContent = models.length;
      let ex = 0,
        gd = 0,
        pr = 0;
      rows.forEach(row => {
        COLS.forEach(c => {
          const v = row[COL_LABELS[c]];
          if (v !== null && v !== undefined && !isNaN(v) && isFinite(v)) {
            const s = getStatus(v);
            if (s === 'excellent') ex++;
            else if (s === 'good') gd++;
            else if (s === 'poor') pr++;
          }
        });
      });
      document.getElementById('cpkExcellent').textContent = ex;
      document.getElementById('cpkGood').textContent = gd;
      document.getElementById('cpkPoor').textContent = pr;
    }

    // ==================== 导出 ====================
    function exportAllData() {
      if (allData.length === 0) {
        Swal.fire({
          icon: 'warning',
          title: getLocalizedText('没有数据', 'No Data'),
          text: getLocalizedText('请先加载数据', 'Please load data first')
        });
        return;
      }

      const allRows = [];
      const dimOrder = ['日', '周', '月', '年'];
      dimOrder.forEach(dim => {
        const rows = computeDimensionData(dim, 'all', 'all');
        if (rows.length === 0) return;
        rows.forEach(row => {
          const exportRow = {
            '车型': row['车型'],
            '时间': row['时间'],
            '检测线号': row['检测线号'],
          };
          COLS.forEach(c => {
            const v = row[COL_LABELS[c]];
            exportRow[COL_LABELS[c]] = (v !== null && v !== undefined && !isNaN(v) &&
              isFinite(v)) ? v.toFixed(4) : '';
          });
          allRows.push(exportRow);
        });
      });

      if (allRows.length === 0) {
        Swal.fire({
          icon: 'warning',
          title: getLocalizedText('没有数据', 'No Data'),
          text: getLocalizedText('没有可导出的数据', 'No data to export')
        });
        return;
      }

      allRows.sort((a, b) => {
        if (a['车型'] !== b['车型']) return a['车型'].localeCompare(b['车型']);
        return String(a['时间']).localeCompare(String(b['时间']));
      });

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(allRows);
      XLSX.utils.book_append_sheet(wb, ws);
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Cpk全部数据.xlsx';
      link.click();
      URL.revokeObjectURL(link.href);

      Swal.fire({
        icon: 'success',
        title: getLocalizedText('导出成功', 'Export Success'),
        text: getLocalizedText('已导出 ' + allRows.length + ' 行数据', 'Exported ' + allRows.length + ' rows'),
        timer: 1500,
        showConfirmButton: false
      });
    }

    // ==================== 应用配置 ====================
    function applyConfig() {
      try {
        const editor = document.getElementById('configEditor');
        const config = JSON.parse(editor.value);

        if (config.VIN_MODEL_MAP) {
          VIN_MODEL_MAP = config.VIN_MODEL_MAP;
        }
        if (config.SPECS) {
          SPECS = config.SPECS;
        }

        displayConfig();

        if (allData.length > 0) {
          updateDropdowns();
          computeAndRender(currentDim);
        }

        Swal.fire({
          icon: 'success',
          title: getLocalizedText('配置已应用', 'Config Applied'),
          timer: 1500,
          showConfirmButton: false
        });
      } catch (e) {
        Swal.fire({
          icon: 'error',
          title: getLocalizedText('JSON格式错误', 'JSON Format Error'),
          text: e.message
        });
      }
    }

    // ==================== 事件绑定 ====================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        computeAndRender(this.dataset.dim);
      });
    });

    document.getElementById('modelSelect').addEventListener('change', function () {
      computeAndRender(currentDim);
    });
    document.getElementById('lineFilter').addEventListener('change', function () {
      computeAndRender(currentDim);
    });

    document.getElementById('loadBtn').addEventListener('click', function () {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.xlsx,.xls';
      input.onchange = function (e) {
        if (this.files && this.files[0]) loadFromFile(this.files[0]);
      };
      input.click();
    });

    document.getElementById('exportBtn').addEventListener('click', exportAllData);
    document.getElementById('applyConfigBtn').addEventListener('click', applyConfig);

    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files && files.length > 0 && (files[0].name.endsWith('.xlsx') || files[0].name.endsWith('.xls'))) {
        loadFromFile(files[0]);
      }
    });

    // 初始化显示配置
    displayConfig();
    console.log('Cpk工具已加载');
  </script>

</body>

</html>
