<script>if(localStorage.getItem('birthdayGreetingShown') !== "true"){           Swal.fire({
                title: '👋生日快乐！',
                text: '你猜我忘没忘？',
                icon: 'info',
                confirmButtonText: '好的，继续',
                showCancelButton: true,
                cancelButtonText: '算了'
            }).then((result) => {
                if (result.isConfirmed) {
                    // 第 2 步：询问心情
                    return Swal.fire({
                        title: '😊 你今天心情怎么样？',
                        text: '选一个选项告诉我吧。',
                        icon: 'question',
                        input: 'radio',
                        inputOptions: {
                            '开心': '😄 开心',
                            '一般': '😐 一般',
                            '不好': '😞 不好'
                        },
                        inputValue: '开心',
                        confirmButtonText: '确认',
                        showCancelButton: true,
                        cancelButtonText: '跳过'
                    });
                } else {
                    // 用户取消第一步
                    Swal.fire('👋 再见', '下次再聊吧！', 'info');
                    return null; // 中断链
                }
            }).then((result) => {
                // 如果上一步被取消或跳过，result 可能为 null 或 dismiss
                if (!result || result.dismiss) {
                    // 如果已经处理过取消，不再重复提示
                    return;
                }

                // 第 3 步：根据心情给出不同回应
                const mood = result.value; // 获取选中的 radio 值
                let reply = '';
                let icon = 'success';

                if (mood === '开心') {
                    reply = '太棒了！继续保持好心情哦！🎉，你发个视频我给你投币';
                } else if (mood === '一般') {
                    reply = '嗯，，你发个视频我给你投币';
                    icon = 'info';
                } else if (mood === '不好') {
                    reply = '别难过，一切都会好起来的。送你一朵小花花，，你发个视频我给你投币';
                    icon = 'warning';
                }

                return Swal.fire({
                    title: '💬 我的回应',
                    text: reply,
                    icon: icon,
                    confirmButtonText: '接着说'
                });
            }).then((result) => {
                if (result && result.isConfirmed) {
                                                        localStorage.setItem('birthdayGreetingShown', true);
                    // 第 4 步：结束对话
                    return Swal.fire({
                        title: '🎯 最后一步',
                        text: '你去看看更新了什么？',
                        showCancelButton: true,
                    });
                } else {
                    // 如果上一步被取消，直接结束
                    Swal.fire('好的，那下次再聊！', '', 'info');
                    return null;
                }
            }).then((result) => {

                if (result && result.isConfirmed) {

                    const userNeed = result.value || '（未填写）';
                } else if (result && result.dismiss) {
                    Swal.fire('👌 没问题', '有需要随时找我。', 'info');
                }
            }).catch((error) => {
                // 捕获任何意外错误
                console.error('对话出错:', error);
                Swal.fire('出错了', '请重试', 'error');
            });};
</script>
