<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-en="QR Studio - Generator">QR Studio - 二维码/条形码生成器</title>

  <!-- 引入你的全局依赖 -->
  <script src="/config/serverUrl.js"></script>
  <link rel="stylesheet" href="/css/styles_button.css">
  <script src="/js/script_openPage.js"></script>
  <link rel="stylesheet" href="/css/styles3_animation.css">
  <script src="/js/script5_setAnimations.js"></script>
  <script src="/js/script6_setFontSize.js"></script>
  <script src="/js/script7_setOpacityandBlur.js"></script>
  <link rel="stylesheet" href="/css/styles4_eyeCare.js.css">
  <script src="/js/script8_setEyeCare.js"></script>
  <link rel="stylesheet" href="/css/styles5_brightness.css">
  <link rel="stylesheet" href="/css/styles6_glow.css">
  <script src="/js/script9_setbrightness.js"></script>
  <script src="/js/script10_setGlow.js"></script>
  <script src="/js/script3_darkMode.js"></script>
  <script src="/js/script4_goBackOrHome.js"></script>
  <script src="/js/script14_setLanguage.js"></script>

  <!-- 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.0.0/dist/iife/reader/index.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="container animate">
    <div class="header">
      <h1 data-en="QR Studio">QR Studio</h1>
      <button class="back-btn" onclick="goBackOrHome()" data-en="Back">返回</button>
    </div>

    <div class="grid-layout">
      <!-- 左栏 -->
      <div>
        <div class="panel">
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('qr')" id="tab-qr" data-en="QR Code">二维码</button>
            <button class="tab-btn" onclick="switchTab('barcode')" id="tab-barcode" data-en="Barcode">条形码</button>
          </div>

          <!-- 二维码生成面板 -->
          <div id="panel-qr">
            <div class="form-group">
              <label class="form-label" data-en="Text or Link">文本或链接</label>
              <textarea id="qrText" class="form-input" placeholder="输入文本或网址，完美支持中文..."
                data-en-placeholder="Enter text or URL..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" data-en="Size Setting">尺寸设置</label>
              <div class="size-control">
                <input type="range" id="qrSizeSlider" min="200" max="2000" step="100" value="400">
                <input type="number" id="qrSizeInput" class="form-input" value="400" min="200" max="5000">
              </div>
              <span class="size-hint" data-en="(200px - 5000px)">拖动滑块或手动输入 (200px - 5000px)</span>
            </div>
            <div class="flex-row form-group">
              <div>
                <label class="form-label" data-en="Error Correction">容错率</label>
                <select id="qrCorrect" class="form-select">
                  <option value="L" data-en="L (7%)">L (7%)</option>
                  <option value="M" data-en="M (15%)">M (15%)</option>
                  <option value="Q" data-en="Q (25%)">Q (25%)</option>
                  <option value="H" selected data-en="H (30%)">H (30%)</option>
                </select>
              </div>
              <div>
                <label class="form-label" data-en="Dot Style">点阵样式</label>
                <select id="qrStyle" class="form-select">
                  <option value="square" data-en="Square">经典方块</option>
                  <option value="dot" data-en="Dot">全圆点</option>
                  <option value="fluid" data-en="Fluid">流体（平滑）</option>
                  <option value="rounded" data-en="Rounded">圆角</option>
                </select>
              </div>
            </div>
            <div class="flex-row form-group">
              <div><label class="form-label" data-en="Foreground">前景色</label><input type="color" id="qrFg"
                  class="color-picker" value="#000000"></div>
              <div><label class="form-label" data-en="Background">背景色</label><input type="color" id="qrBg"
                  class="color-picker" value="#ffffff"></div>
            </div>
            <div class="form-group">
              <label class="form-label" data-en="Center Logo (Optional)">中心 Logo（可选）</label>
              <div class="file-upload-wrapper">
                <input type="file" id="qrLogo" accept="image/*" onchange="updateFileName(this)">
                <div class="file-upload-text" id="fileNameText" data-en="Click to select image">点击选择图片</div>
                <div class="file-upload-hint" data-en="Supports PNG, JPG">支持 PNG, JPG</div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" data-en="Logo Border Style">Logo 边框样式</label>
              <select id="qrLogoStyle" class="form-select">
                <option value="square" data-en="Square">方形白底</option>
                <option value="circle" data-en="Circle">圆形白底</option>
                <option value="none" data-en="None">无边框（直接贴图）</option>
              </select>
            </div>
          </div>

          <!-- 条形码生成面板 -->
          <div id="panel-barcode" class="hidden">
            <div class="form-group">
              <label class="form-label" data-en="Barcode Content">条码内容 (数字或字母)</label>
              <input type="text" id="barcodeText" class="form-input" placeholder="例如：123456789012"
                data-en-placeholder="e.g. 123456789012">
            </div>
            <div class="flex-row form-group">
              <div>
                <label class="form-label" data-en="Format">条码格式</label>
                <select id="barcodeFormat" class="form-select">
                  <option value="CODE128" data-en="CODE128 (Alpha-Numeric)">CODE128 (支持字母数字)</option>
                  <option value="EAN13" data-en="EAN-13 (12 digits)">EAN-13 (需12位数字)</option>
                  <option value="UPC" data-en="UPC-A (11 digits)">UPC-A (需11位数字)</option>
                  <option value="CODE39" data-en="CODE39">CODE39</option>
                </select>
              </div>
              <div>
                <label class="form-label" data-en="Show Text">显示文字</label>
                <select id="barcodeDisplayValue" class="form-select">
                  <option value="true" selected data-en="Show">显示</option>
                  <option value="false" data-en="Hide">隐藏</option>
                </select>
              </div>
            </div>
          </div>

          <button class="btn btn-primary" onclick="generateCode()" data-en="Generate">生成</button>
        </div>

        <div class="panel">
          <div class="panel-title" data-en="Scan QR / Barcode">扫描二维码 / 条形码</div>
          <div class="flex-row" style="margin-bottom: 16px;">
            <button class="btn btn-primary" onclick="document.getElementById('scanFile').click()"
              data-en="Upload Image to Scan">上传图片识别</button>
            <input type="file" id="scanFile" accept="image/*" style="display: none;" onchange="scanFile(event)">
          </div>
          <div class="form-group">
            <label class="form-label" data-en="Scan Result">扫描结果</label>
            <textarea id="scanResult" class="form-input" placeholder="识别内容会显示在此处..."
              data-en-placeholder="Result will display here..."></textarea>
          </div>
          <button class="btn btn-outline" onclick="editScannedContent()" data-en="Import to Editor">导入到编辑器</button>
        </div>
      </div>

      <!-- 右栏预览 -->
      <div class="preview-panel panel" style="position: sticky; top: 20px;">
        <div class="panel-title" data-en="Live Preview">实时预览</div>
        <div class="preview-area" id="desktopPreviewArea">
          <div id="qrcode-canvas-container"></div>
          <div id="barcode-container" class="hidden"></div>
        </div>
        <button class="btn btn-outline" onclick="downloadCode()" data-en="Download Image">下载图片</button>
      </div>
    </div>
  </div>

  <!-- 移动端弹窗 -->
  <div class="mobile-modal" id="mobileModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px; font-size: 16px;" data-en="Generated Successfully">生成成功</h3>
      <img id="mobileImg" src="" alt="Code">
      <div class="modal-btns">
        <button class="btn btn-outline" style="padding: 10px; font-size: 14px;" onclick="closeMobileModal()"
          data-en="Close">关闭</button>
        <button class="btn btn-primary" style="padding: 10px; font-size: 14px;" onclick="downloadCode()"
          data-en="Download">下载</button>
      </div>
    </div>
  </div>
<script src="./QR&Barcode.js"></script>

</body>

</html>
