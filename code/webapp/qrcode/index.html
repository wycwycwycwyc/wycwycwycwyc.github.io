<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Studio - 二维码编辑器</title>

  <!-- 引入全局依赖 -->
  <script src="/config/serverUrl.js"></script>
  <link rel="stylesheet" href="/css/styles_button.css">
  <script src="/js/script_openPage.js"></script>
  <link rel="stylesheet" href="/css/styles3_animation.css">
  <script src="/js/script5_setAnimations.js"></script>
  <script src="/js/script6_setFontSize.js"></script>
  <script src="/js/script7_setOpacityandBlur.js"></script>
  <link rel="stylesheet" href="/css/styles4_eyeCare.js.css">
  <script src="/js/script8_setEyeCare.js"></script>
  <link rel="stylesheet" href="/css/styles5_brightness.css">
  <link rel="stylesheet" href="/css/styles6_glow.css">
  <script src="/js/script9_setbrightness.js"></script>
  <script src="/js/script10_setGlow.js"></script>
  <script src="/js/script4_goBackOrHome.js"></script>
  <script src="/js/script14_setLanguage.js"></script>

  <!-- 【核心库】采用 node-qrcode (原生完美 UTF-8) + jsQR 扫码 -->
  <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 极简设计系统 */
    :root {
      --bg-color: #f9fafb;
      --panel-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 12px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body.dark-mode {
      --bg-color: #111827;
      --panel-bg: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --primary-color: #3b82f6;
      --primary-hover: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .back-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--border-color);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        display: none !important;
      }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: var(--primary-color);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }

    .flex-row {
      display: flex;
      gap: 12px;
    }

    .flex-row>* {
      flex: 1;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .size-control input[type="range"] {
      flex: 1;
      accent-color: var(--primary-color);
    }

    .size-control input[type="number"] {
      width: 80px;
    }

    .size-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      display: block;
    }

    .file-upload-wrapper {
      position: relative;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-upload-wrapper:hover {
      border-color: var(--primary-color);
      background: rgba(37, 99, 235, 0.05);
    }

    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-text {
      font-size: 14px;
      color: var(--text-main);
    }

    .file-upload-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .color-picker {
      -webkit-appearance: none;
      width: 100%;
      height: 40px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .color-picker::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--border-color);
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    #qrcode-canvas-container canvas {
      max-width: 100%;
      max-height: 300px;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
    }

    #video-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      margin-bottom: 16px;
      background: #000;
    }

    #video-container video {
      width: 100%;
      display: block;
    }

    .mobile-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mobile-modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .mobile-modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content img {
      width: 100%;
      max-width: 250px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .modal-btns {
      display: flex;
      gap: 12px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>

<body>

  <div class="container animate">
    <div class="header">
      <h1>QR Studio</h1>
      <button class="back-btn" onclick="goBackOrHome()">返回</button>
    </div>

    <div class="grid-layout">

      <!-- 左栏 -->
      <div>
        <div class="panel">
          <div class="panel-title">生成二维码</div>

          <div class="form-group">
            <label class="form-label">文本或链接</label>
            <textarea id="qrText" class="form-input" placeholder="输入文本或网址，完美支持中文..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">尺寸设置</label>
            <div class="size-control">
              <input type="range" id="qrSizeSlider" min="200" max="2000" step="100" value="400">
              <input type="number" id="qrSizeInput" class="form-input" value="400" min="200" max="5000">
            </div>
            <span class="size-hint">拖动滑块或手动输入 (200px - 5000px)</span>
          </div>

          <div class="flex-row form-group">
            <div>
              <label class="form-label">容错率</label>
              <select id="qrCorrect" class="form-select">
                <option value="L">L (7%)</option>
                <option value="M" selected>M (15%)</option>
                <option value="Q">Q (25%)</option>
                <option value="H">H (30%)</option>
              </select>
            </div>
            <div>
              <label class="form-label">点阵样式</label>
              <select id="qrStyle" class="form-select">
                <option value="square">经典方块</option>
                <option value="dot">全圆点</option>
                <option value="fluid">流体（平滑）</option>
                <option value="rounded">圆角</option>
              </select>
            </div>
          </div>

          <div class="flex-row form-group">
            <div>
              <label class="form-label">前景色</label>
              <input type="color" id="qrFg" class="color-picker" value="#000000">
            </div>
            <div>
              <label class="form-label">背景色</label>
              <input type="color" id="qrBg" class="color-picker" value="#ffffff">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">中心 Logo（可选）</label>
            <div class="file-upload-wrapper">
              <input type="file" id="qrLogo" accept="image/*" onchange="updateFileName(this)">
              <div class="file-upload-text" id="fileNameText">点击选择图片</div>
              <div class="file-upload-hint">支持 PNG, JPG</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Logo 边框样式</label>
            <select id="qrLogoStyle" class="form-select">
              <option value="square">方形白底</option>
              <option value="circle">圆形白底</option>
              <option value="none">无边框（直接贴图）</option>
            </select>
          </div>

          <button class="btn btn-primary" onclick="generateQRCode()">生成</button>
        </div>

        <div class="panel">
          <div class="panel-title">扫描二维码</div>
          <div id="video-container">
            <video id="videoElement" autoplay playsinline></video>
          </div>
          <div class="flex-row" style="margin-bottom: 16px;">
            <button class="btn btn-outline" id="cameraBtn" onclick="startCamera()">摄像头</button>
            <button class="btn btn-outline" onclick="document.getElementById('scanFile').click()">图片</button>
            <input type="file" id="scanFile" accept="image/*" style="display: none;" onchange="scanFile(event)">
          </div>
          <div class="form-group">
            <label class="form-label">扫描结果</label>
            <textarea id="scanResult" class="form-input" placeholder="扫描内容会显示在此处..."></textarea>
          </div>
          <button class="btn btn-primary" onclick="editScannedContent()">导入到编辑器</button>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="preview-panel panel" style="position: sticky; top: 20px;">
        <div class="panel-title">实时预览</div>
        <div class="preview-area" id="desktopPreviewArea">
          <div id="qrcode-canvas-container"></div>
        </div>
        <button class="btn btn-outline" onclick="downloadQRCode()">下载图片</button>
      </div>

    </div>
  </div>

  <div class="mobile-modal" id="mobileModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px; font-size: 16px;">二维码已生成</h3>
      <img id="mobileQrImg" src="" alt="QR Code">
      <div class="modal-btns">
        <button class="btn btn-outline" style="padding: 10px; font-size: 14px;" onclick="closeMobileModal()">关闭</button>
        <button class="btn btn-primary" style="padding: 10px; font-size: 14px;" onclick="downloadQRCode()">下载</button>
      </div>
    </div>
  </div>

  <script>
    // 同步尺寸
    const sizeSlider = document.getElementById('qrSizeSlider');
    const sizeInput = document.getElementById('qrSizeInput');
    sizeSlider.addEventListener('input', () => { sizeInput.value = sizeSlider.value; });
    sizeInput.addEventListener('input', () => {
      const val = parseInt(sizeInput.value);
      if (val >= 200 && val <= 2000) sizeSlider.value = val;
      else sizeSlider.value = 2000;
    });

    function updateFileName(input) {
      const text = document.getElementById('fileNameText');
      if (input.files && input.files.length > 0) {
        text.textContent = input.files[0].name;
        text.style.color = "var(--primary-color)";
      } else {
        text.textContent = "点击选择图片";
        text.style.color = "var(--text-main)";
      }
    }

    let currentQRCodeUrl = '';

    async function generateQRCode() {
      const textInput = document.getElementById('qrText').value;
      const text = textInput.trim() === '' ? ' ' : textInput;

      let size = parseInt(sizeInput.value) || 400;
      if (size < 200) { size = 200; sizeInput.value = 200; sizeSlider.value = 200; Swal.fire('提示', '最小尺寸为 200px', 'info'); }
      else if (size > 5000) { size = 5000; sizeInput.value = 5000; sizeSlider.value = 2000; Swal.fire('提示', '最大尺寸为 5000px', 'info'); }

      const correctStr = document.getElementById('qrCorrect').value;
      const fgColor = document.getElementById('qrFg').value;
      const bgColor = document.getElementById('qrBg').value;
      const style = document.getElementById('qrStyle').value;
      const logoInput = document.getElementById('qrLogo');
      const logoStyle = document.getElementById('qrLogoStyle').value;

      const container = document.getElementById('qrcode-canvas-container');
      container.innerHTML = '';

      try {
        // 使用 node-qrcode 提取底层的矩阵数据
        // 这个库原生完美支持 UTF-8 编码，扫出来绝不可能乱码
        const qrData = QRCode.create(text, { errorCorrectionLevel: correctStr });
        const moduleCount = qrData.modules.size;
        const data = qrData.modules.data;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = size;
        canvas.height = size;

        const cellSize = size / moduleCount;

        // 绘制背景
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, size, size);

        // 绘制点阵
        ctx.fillStyle = fgColor;
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            if (data[row * moduleCount + col]) {
              const x = col * cellSize;
              const y = row * cellSize;

              if (style === 'dot') {
                ctx.beginPath();
                ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 2.2, 0, Math.PI * 2);
                ctx.fill();
              } else if (style === 'fluid') {
                ctx.beginPath();
                ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 1.6, 0, Math.PI * 2);
                ctx.fill();
              } else if (style === 'rounded') {
                const r = cellSize * 0.3;
                ctx.beginPath();
                if (ctx.roundRect) {
                  ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, r);
                } else {
                  ctx.rect(x + 1, y + 1, cellSize - 2, cellSize - 2);
                }
                ctx.fill();
              } else {
                // 经典方块
                ctx.fillRect(x, y, cellSize + 0.5, cellSize + 0.5);
              }
            }
          }
        }

        // 处理 Logo
        if (logoInput.files && logoInput.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
              const logoSize = size * 0.2;
              const logoX = (size - logoSize) / 2;
              const logoY = (size - logoSize) / 2;

              if (logoStyle !== 'none') {
                ctx.fillStyle = bgColor;
                ctx.beginPath();
                if (logoStyle === 'circle') {
                  ctx.arc(size / 2, size / 2, logoSize / 2 + 4, 0, Math.PI * 2);
                  ctx.fill();
                } else {
                  const r = 8; const padding = 4;
                  const bx = logoX - padding; const by = logoY - padding;
                  const bs = logoSize + padding * 2;
                  if (ctx.roundRect) {
                    ctx.roundRect(bx, by, bs, bs, r);
                  } else {
                    ctx.rect(bx, by, bs, bs);
                  }
                  ctx.fill();
                }
              }

              if (logoStyle === 'circle') {
                ctx.save();
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, logoSize / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(img, logoX, logoY, logoSize, logoSize);
                ctx.restore();
              } else {
                ctx.drawImage(img, logoX, logoY, logoSize, logoSize);
              }

              finishGenerate(canvas);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(logoInput.files[0]);
        } else {
          finishGenerate(canvas);
        }

      } catch (err) {
        console.error("二维码生成失败:", err);
        Swal.fire('生成失败', '内容过长，请缩短文本或调低容错率', 'error');
      }
    }

    function finishGenerate(canvas) {
      currentQRCodeUrl = canvas.toDataURL("image/png");

      const container = document.getElementById('qrcode-canvas-container');
      if (container) {
        const deskCanvas = document.createElement('canvas');
        deskCanvas.width = canvas.width;
        deskCanvas.height = canvas.height;
        deskCanvas.getContext('2d').drawImage(canvas, 0, 0);
        container.appendChild(deskCanvas);
      }

      if (window.innerWidth <= 768) {
        document.getElementById('mobileQrImg').src = currentQRCodeUrl;
        const modal = document.getElementById('mobileModal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
      }
    }

    function closeMobileModal() {
      const modal = document.getElementById('mobileModal');
      modal.classList.remove('show');
      setTimeout(() => modal.style.display = 'none', 300);
    }

    function downloadQRCode() {
      if (!currentQRCodeUrl) return;
      const a = document.createElement('a');
      a.href = currentQRCodeUrl;
      a.download = 'qrcode.png';
      a.click();
    }

    // ==================== 高强度扫码逻辑 (jsQR) ====================
    const video = document.getElementById('videoElement');
    const videoContainer = document.getElementById('video-container');
    const cameraBtn = document.getElementById('cameraBtn');
    let stream = null;
    let scanAnimationFrame = null;

    async function startCamera() {
      if (stream) {
        stopCamera();
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();

        videoContainer.style.display = 'block';
        cameraBtn.textContent = '关闭相机';

        requestAnimationFrame(tick);
      } catch (err) {
        Swal.fire('错误', '无法启动摄像头，请确保在 HTTPS 环境下并已授权。', 'error');
        console.error(err);
      }
    }

    function stopCamera() {
      if (scanAnimationFrame) cancelAnimationFrame(scanAnimationFrame);
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      videoContainer.style.display = 'none';
      cameraBtn.textContent = '摄像头';
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          onScanSuccess(code.data);
          stopCamera();
          return;
        }
      }
      scanAnimationFrame = requestAnimationFrame(tick);
    }

    function scanFile(event) {
      if (event.target.files.length === 0) return;
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "attemptBoth",
          });

          if (code && code.data) {
            onScanSuccess(code.data);
          } else {
            Swal.fire('失败', '未能从图片中识别到二维码，请确保二维码清晰。', 'error');
          }
          event.target.value = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function onScanSuccess(decodedText) {
      if (navigator.vibrate) navigator.vibrate(100);
      document.getElementById('scanResult').value = decodedText;

      Swal.fire({
        toast: true, position: 'top-end', icon: 'success',
        title: '扫描成功', showConfirmButton: false, timer: 2000
      });
    }

    function editScannedContent() {
      const result = document.getElementById('scanResult').value;
      if (!result) return Swal.fire('提示', '没有可编辑的内容', 'warning');

      document.getElementById('qrText').value = result;
      document.getElementById('scanResult').value = '';

      Swal.fire({
        toast: true, position: 'top-center', icon: 'success',
        title: '已导入到编辑器', showConfirmButton: false, timer: 1500
      });
    }
  </script>
</body>

</html>
