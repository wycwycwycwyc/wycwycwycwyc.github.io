<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
  <title data-en="Chinese Chess · Select Version">中国象棋 · 选择版本</title>
  <script src="/config/serverUrl.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles_button.css">
  <script src="/js/script4_goBackOrHome.js"></script>
  <script src="/js/script13_checkIslogin.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.js"></script>
  <link href="/css/message.min.css" rel="stylesheet" />
  <script src="/js/message.min.js"></script>
  <script src="/js/script14_setLanguage.js"></script>
        <button id="back" class="custom-button" style="position: fixed; top: 10px; left: 10px;z-index: 10;"
          onclick="goBackOrHome()" data-en="Back">返回</button>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #3d6b4a, #1a3a28 80%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      padding: 20px;
    }

    /* ===== 面板 ===== */
    .panel {
      background: linear-gradient(160deg, #e2c49a, #c9a87c 40%, #b58b5a);
      border-radius: 36px;
      padding: 36px 28px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 3px #a07d54, inset 0 0 25px rgba(90, 60, 30, 0.5);
      display: flex;
      flex-direction: column;
      gap: 32px;
      /* 面板内三大块（标题组、列表、底部提示）的间距 */
      width: 420px;
      max-width: 92vw;
    }

    /* 标题组容器 */
    .header-group {
      text-align: center;
    }

    .header-group h1 {
      margin: 0;
      color: #3d2a1a;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .header-group .subtitle {
      margin-top: 8px;
      /* 正常间距，防止重叠 */
      color: #5a3f28;
      font-size: 0.86rem;
    }

    /* 列表容器：拉开两卡片之间的绝对距离 */
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* 游戏卡片：调薄内边距，让卡片本身不那么厚重 */
    .game-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: linear-gradient(180deg, #3d2a1a, #2a1e10);
      border-radius: 50px;
      border: 1px solid #7a5a3a;
      box-shadow: 0 4px 0 #1a1008, 0 6px 12px rgba(0, 0, 0, 0.5);
      text-decoration: none;
      color: #eedbba;
      transition: 0.08s linear;
      cursor: pointer;
    }

    .game-item:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1a1008, 0 6px 12px rgba(0, 0, 0, 0.5);
    }

    .game-item .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: radial-gradient(circle at 30% 25%, #fff7e6 0%, #f3dcb3 22%, #d8b37a 60%, #b88f56 100%);
      box-shadow: 0 3px 0 #5a3f22, 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    .game-item .body {
      flex: 1;
      min-width: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      /* 内部行间距 */
    }

    .game-item .body h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: bold;
      color: #f3d37c;
      letter-spacing: 1px;
    }

    .game-item .body p {
      margin: 0;
      font-size: 0.78rem;
      color: #c9a87c;
      line-height: 1.3;
    }

    .game-item .body .note {
      margin: 0;
      font-size: 0.72rem;
      color: #8f7658;
    }

    .game-item .arrow {
      color: #c9a87c;
      font-size: 20px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .game-item:hover .arrow {
      transform: translateX(3px);
    }

    /* 底部提示 */
    .panel .footnote {
      text-align: center;
      color: #5a3f28;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 28px 18px;
        gap: 24px;
      }

      .header-group h1 {
        font-size: 1.3rem;
      }

      .game-list {
        gap: 20px;
      }

      .game-item {
        padding: 12px 16px;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="panel">
    <!-- 标题组 -->
    <div class="header-group">
      <h1 data-en="Chinese Chess">中国象棋</h1>
      <div class="subtitle" data-en="Choose a version to enter">选择要进入的版本</div>
    </div>

    <!-- 游戏列表 -->
    <div class="game-list" id="game-list"></div>

    <!-- 底部提示 -->
    <div class="footnote">
      <span
        data-en="All versions support offline and online play, with automatic score recording.">所有版本均支持离线/在线对弈，自动记录战绩。</span>
    </div>
  </div>

  <script>
    const GAMES = {
      chess: {
        name: { zh: "中国象棋 · 揭棋", en: "Chinese Chess · Flip Chess" },
        Introduction: { zh: "经典象棋与揭棋双模式", en: "Classic Chess & Flip Chess modes" },
        note: { zh: "明棋对弈 / 随机暗棋 · 在线房间对战", en: "Open pieces / random hidden pieces · online rooms" },
        path: "./ChineseChess/index.html"
      },
      flip: {
        name: { zh: "象棋翻棋", en: "Flip Chess" },
        Introduction: { zh: "同步规划模式 · 棋子速度与碰撞", en: "Simultaneous planning mode · piece speed & collision" },
        note: { zh: "经典模式 / 同步规划模式 · 在线房间对战", en: "Classic mode / sync planning mode · online rooms" },
        path: "./FlipChess/index.html"
      }
    };

    const list = document.getElementById("game-list");

    Object.entries(GAMES).forEach(([id, game]) => {
      const a = document.createElement("a");
      a.className = "game-item";
      a.href = game.path;
      a.innerHTML = `
        <span class="icon">♟️</span>
        <div class="body">
          <h2 data-en="${game.name.en}">${game.name.zh}</h2>
          <p data-en="${game.Introduction.en}">${game.Introduction.zh}</p>
          <div class="note" data-en="${game.note.en}">${game.note.zh}</div>
        </div>
        <span class="arrow">›</span>
      `;
      list.appendChild(a);
    });

    if (window.i18n && typeof window.i18n.registerAll === "function") {
      window.i18n.registerAll();
    } else if (window.i18n && typeof window.i18n.register === "function") {
      document.querySelectorAll("[data-en]").forEach(el => window.i18n.register(el));
    }
  </script>
</body>

</html>
