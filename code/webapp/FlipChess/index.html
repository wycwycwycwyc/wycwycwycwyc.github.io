<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
  <title>象棋翻棋</title>
  <script src="/config/serverUrl.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles_button.css">
  <script src="/js/script4_goBackOrHome.js"></script>
  <script src="/js/script13_checkIslogin.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.23.0/sweetalert2.min.js"></script>
  <link href="/css/message.min.css" rel="stylesheet" />
  <script src="/js/message.min.js"></script>
  <script src="/js/script14_setLanguage.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="banner" id="globalBanner"></div>

  <button class="chat-fab hidden" id="chatFab" onclick="openChatModal()" title="聊天">
    <i class="fas fa-comment-dots"></i>
    <span class="chat-fab-badge hidden" id="chatBadge">0</span>
  </button>

  <div class="chat-notice-container" id="chatNoticeContainer"></div>

  <div class="modal-mask" id="confirmModal">
    <div class="modal-box">
      <h3 id="confirmText"></h3>
      <div class="modal-btns">
        <button class="btn btn-undo" onclick="confirmYes()">同意</button>
        <button class="btn btn-back" onclick="confirmNo()">拒绝</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="winnerModal">
    <div class="modal-box winner-box">
      <div class="winner-icon" id="winnerIcon">🏆</div>
      <h3 class="winner-title" id="winnerTitle">红方获胜！</h3>
      <div class="modal-btns">
        <button class="btn btn-reset" onclick="closeWinnerModal()">确定</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="timeControlModal">
    <div class="modal-box time-box">
      <h3>选择时间控制</h3>
      <div class="time-options">
        <button class="time-option-btn" onclick="selectTimeOption('standard')">
          <div class="time-option-title">标准</div>
          <div class="time-option-desc">15分 + 60秒</div>
        </button>
        <button class="time-option-btn" onclick="selectTimeOption('fast')">
          <div class="time-option-title">快棋</div>
          <div class="time-option-desc">10分 + 30秒</div>
        </button>
        <button class="time-option-btn" onclick="selectTimeOption('blitz')">
          <div class="time-option-title">超快</div>
          <div class="time-option-desc">5分 + 20秒</div>
        </button>
        <button class="time-option-btn" onclick="selectTimeOption('none')">
          <div class="time-option-title">关闭</div>
          <div class="time-option-desc">仅正计时，不超时</div>
        </button>
      </div>
      <div class="modal-btns">
        <button class="btn btn-back" onclick="cancelTimeSelect()">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="modeSelectModal">
    <div class="modal-box time-box">
      <h3>选择游戏模式</h3>
      <div class="mode-options">
        <button class="mode-option-btn" onclick="pickMode('classic')">
          <div class="mode-option-title">经典模式</div>
          <div class="mode-option-desc">轮流走棋<br>传统规则</div>
        </button>
        <button class="mode-option-btn" onclick="pickMode('sync')">
          <div class="mode-option-title">同步规划模式</div>
          <div class="mode-option-desc">同时规划，一起播放<br>棋子有速度、碰撞</div>
        </button>
      </div>
      <div class="modal-btns">
        <button class="btn btn-back" onclick="cancelModeSelect()">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="syncModeModal">
    <div class="modal-box time-box">
      <h3>同步规划模式设置</h3>
      <div class="field-row" style="text-align:left;">
        <label>每回合可操作步数</label>
        <div class="step-options">
          <button class="step-opt" onclick="pickSyncSteps(1)">1 步</button>
          <button class="step-opt" onclick="pickSyncSteps(2)">2 步</button>
          <button class="step-opt" onclick="pickSyncSteps(3)">3 步</button>
          <button class="step-opt" onclick="pickSyncSteps(4)">4 步</button>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn btn-back" onclick="cancelSyncMode()">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="chatModal">
    <div class="modal-box chat-modal-box">
      <h3>聊天</h3>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-presets" id="chatPresets"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" maxlength="50" placeholder="输入消息...">
        <button class="btn btn-reset" id="chatSendBtn">发送</button>
      </div>
      <div class="modal-btns">
        <button class="btn btn-back" onclick="closeChatModal()">关闭</button>
      </div>
    </div>
  </div>

  <div class="panel" id="menuPanel">
    <h1>象棋翻棋</h1>
    <button class="menu-btn" onclick="showOffline()">离线对弈</button>
    <button class="menu-btn secondary" onclick="showOnline()">在线对弈</button>
    <button class="menu-btn secondary" onclick="showRecords()">排行榜</button>
  </div>

  <div class="panel hidden" id="lobbyPanel">
    <h2>在线对弈</h2>
    <div class="field-row">
      <label>当前用户</label>
      <div class="user-badge" id="lobbyUserLabel">—</div>
    </div>
    <div class="field-row">
      <label>在线用户 <span style="font-weight:normal;font-size:0.78rem;color:#5a3f28;">（点击可邀请）</span></label>
      <div class="online-users-list" id="onlineUsersList">
        <div style="text-align:center; color:#5a3f28; font-size:0.85rem; padding:8px;">加载中...</div>
      </div>
    </div>
    <div class="field-row">
      <label>房间号（6位数字）</label>
      <div style="display:flex; gap:8px;">
        <input id="lobbyRoom" placeholder="输入房间号或创建" style="flex:1;" maxlength="6">
        <button class="btn btn-reset" onclick="createRoom()">创建</button>
      </div>
    </div>
    <button class="menu-btn" onclick="joinRoom()">加入房间</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
    <div class="hint" id="lobbyHint"></div>
  </div>

  <div class="panel hidden" id="waitPanel">
    <h2>房间：<span id="waitRoomLabel">------</span></h2>
    <div style="text-align:center; color:#3d2a1a; font-weight:bold;" id="waitStatus">等待对手加入...</div>
    <div class="ready-area">
      <div><span class="ready-dot" id="dotSelf"></span>我</div>
      <div><span class="ready-dot" id="dotOpp"></span>对手</div>
    </div>
    <button class="menu-btn" id="readyBtn" onclick="toggleReady()" disabled>准备</button>
    <button class="menu-btn secondary" onclick="leaveRoom()">离开房间</button>
    <div class="hint" id="waitHint"></div>
    <div class="log-panel" id="netLog"></div>
  </div>

  <div class="game-panel hidden" id="gamePanel">
    <div class="room-info-wrap">
      <div class="room-info">
        <span>房间：</span><span class="badge" id="gameRoomLabel">----</span>
        <span id="gameRoleLabel"></span>
        <span id="gameColorLabel" style="color:#f3d37c;"></span>
        <span id="gameOppLabel" style="color:#b32b2b;"></span>
        <span id="connDot" class="conn-indicator"></span>
      </div>
      <div class="time-info" id="timeInfo"></div>
    </div>

    <div class="sync-bar hidden" id="syncBar">
      <div class="sync-phase" id="syncPhase">规划阶段</div>
      <div class="sync-steps" id="syncSteps">步数：0 / 3</div>
      <div class="sync-buttons">
        <button class="btn btn-back" id="syncReplayBtn" onclick="replayLastPlayback()" style="display:none;">回放</button>
        <button class="btn btn-back" onclick="clearSyncQueue()">清空</button>
        <button class="btn btn-primary" id="syncSubmitBtn" onclick="submitSyncPlan()">完成</button>
      </div>
    </div>

    <div class="main-content">
      <div class="graveyard">
        <div class="graveyard-list" id="redGraveyard"></div>
      </div>
      <div class="board-container">
        <div class="board" id="board"></div>
        <svg class="board-overlay" id="boardOverlay" viewBox="0 0 304 608" preserveAspectRatio="none"></svg>
      </div>
      <div class="graveyard">
        <div class="graveyard-list" id="blackGraveyard"></div>
      </div>
    </div>

    <div class="status-bar">
      <div class="turn-icon unknown-icon" id="turnIcon"></div>
      <div id="statusText"></div>
      <div class="btn-group">
        <button class="btn btn-primary" id="yieldBtn" onclick="yieldFirst()" disabled>让先</button>
        <button class="btn btn-undo" id="undoBtn" disabled>悔棋</button>
        <button class="btn btn-draw" id="drawBtn" onclick="requestDraw()" disabled>和棋</button>
        <button class="btn btn-resign" id="resignBtn" onclick="resign()" disabled>认输</button>
        <button class="btn btn-reset" id="resetBtn">重新开局</button>
        <button class="btn btn-back" onclick="exitGame()">返回</button>
      </div>
    </div>
  </div>

  <div class="panel hidden" id="recordsPanel">
    <h2>象棋翻棋排行榜</h2>
    <div class="records-list" id="recordsList">
      <div style="text-align:center; padding:20px; color:#5a3f28;">加载中...</div>
    </div>
    <button class="menu-btn secondary" onclick="refreshRecords()">刷新</button>
    <button class="menu-btn secondary" onclick="backToMenu()">返回</button>
    <div class="hint" id="recordsHint"></div>
  </div>

  <script src="./FlipChess.js"></script>
</body>

</html>
