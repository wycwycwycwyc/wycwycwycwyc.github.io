<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>天气查询</title>
  <link rel="stylesheet" href="/css/styles_button.css">
    <link rel="stylesheet" href="/css/styles_button.css">
    <link rel="stylesheet" href="/css/styles3_animation.css">
    <link rel="stylesheet" href="/css/styles4_eyeCare.js.css">
    <link rel="stylesheet" href="/css/styles5_brightness.css">
    <link rel="stylesheet" href="/css/styles6_glow.css">
    <script src="/js/script3_darkMode.js"></script>
    <script src="/js/script4_goBackOrHome.js"></script>
    <script src="/js/script5_setAnimations.js"></script>
    <script src="/js/script6_setFontSize.js"></script>
    <script src="/js/script8_setEyeCare.js"></script>
    <script src="/js/script9_setbrightness.js"></script>
    <script src="/js/script10_setGlow.js"></script>
    <link href="style.css" rel="stylesheet">
    <link href="/css/message.min.css" rel="stylesheet" />
    <script src="/js/message.min.js"></script>
    <script src="/js/script14_setLanguage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js">
  </script>
</head>

<body>
  <button class="rank-btn" onclick="window.weatherApp.showRankModal()"
    style="position:fixed;top:10px;right:10px;z-index:10;background:rgba(255,255,255,0.8);border:1px solid #cbd5e1;border-radius:2rem;padding:0.5rem 1.2rem;cursor:pointer;font-weight:600;backdrop-filter:blur(10px);"
    data-en="Live Ranking">实况排行</button>
  <div class="main-container">
    <h1 data-en="Weather Forecast">天气查询</h1>
<button class="custom-button" style="position: fixed; top: 10px; left: 10px;" onclick="goBackOrHome()"
  data-en="Back">返回</button>
    <div class="search-wrapper">
      <input type="text" id="citySearch" placeholder="搜索城市..." data-en="Search city...">
      <ul id="searchResults" class="search-results"></ul>
    </div>

    <div class="province-row">
      <select id="provinceSelect">
        <option value="" data-en="Select Province">-- 选择省份 --</option>
      </select>
      <select id="stationSelect" disabled>
        <option value="" data-en="Select City">-- 请先选择省份 --</option>
      </select>
    </div>
    <!-- 收藏城市标签行 -->
    <div class="favorite-row" id="favoriteRow" style="display:none;">
      <div class="favorite-tags" id="favoriteTags"></div>
      <button class="favorite-btn" onclick="window.weatherApp.toggleFavorite()" id="favoriteToggleBtn">
        收藏当前城市
      </button>
    </div>
    <div id="weatherContainer">
      <div style="text-align:center;padding:2rem;opacity:0.8;" data-en="Please select a city">📍 请选择城市查看天气</div>
    </div>
  </div>

  <div id="warnModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="window.weatherApp.closeWarnModal()">&times;</button>
      <div id="warnModalContent"></div>
    </div>
  </div>

  <div id="radarModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="window.weatherApp.closeRadarModal()">&times;</button>
      <img id="radarModalImg" src="" alt="雷达图" style="width:100%;">
    </div>
  </div>
</body>
<script src="weatherForecast.js"></script>
</html>
